<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live demo | SavorCline</title>
  <meta name="description" content="Try SavorCline's allergen changeover checks, production sequencing, cleaning verification, document extraction and reporting on sample bakery data or your own products.">
  <meta name="theme-color" content="#1f5c45">
  <link rel="canonical" href="https://www.savorcline.site/demo">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/app.css">
  <link rel="stylesheet" href="src/styles/pages.css">
</head>
<body class="app">
  <a class="skip" href="#view">Skip to workspace</a>
  <header data-header></header>
  <div class="demo-banner" role="note"><div class="wrap"><b>Live demo · Sample data</b> · Runs in your browser — nothing is sent to a server. The bakery, products and records are fictional. <a href="contact">Request a pilot on your own data →</a></div></div>

  <div class="ws">
    <aside class="ws-side" aria-label="Workspace sections">
      <div class="ws-site">
        <span class="mono muted">Workspace</span>
        <strong data-site-name></strong>
        <span data-data-badge></span>
      </div>
      <nav class="ws-nav" data-ws-nav></nav>
      <div class="ws-tools">
        <button class="btn ghost small" data-reset>Reset demo data</button>
        <button class="btn danger small" data-clear>Start empty</button>
        <p class="muted ws-privacy">Data is saved only in this browser (localStorage). Nothing is uploaded.</p>
      </div>
    </aside>
    <main class="ws-main" id="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <div class="toast" role="status" aria-live="polite" data-toast></div>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
